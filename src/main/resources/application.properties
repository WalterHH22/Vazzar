spring.application.name=vaazar-api

# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vaazar
spring.datasource.username=vaazar
spring.datasource.password=vaazar
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Flyway y Hibernate
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# =====================================================================
# Bounded Contexts / Módulos (Estados iniciales)
# Se pueden encender y apagar dinámicamente en tiempo de ejecución
# desde la vista web (/admin/modules) o vía la API /api/admin/modules
# =====================================================================
modules.identity.enabled=true
modules.inventory.enabled=true
modules.billing.enabled=false
modules.ecommerce.enabled=false
modules.fair.enabled=false

# =====================================================================
# JWT (Bounded Context: Identity)
# =====================================================================
jwt.secret=vazzarSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHmacSha256Security2026
jwt.expiration-ms=86400000
