spring.application.name=vaazar-api
server.port=${PORT:8080}

# Conexión a PostgreSQL (compatible con Railway, Render y Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:vaazar}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:vaazar}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:vaazar}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Flyway y Hibernate
spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=update

# =====================================================================
# Bounded Contexts / Módulos (Estados iniciales)
# =====================================================================
modules.identity.enabled=true
modules.inventory.enabled=true
modules.ecommerce.enabled=true
modules.fair.enabled=true
modules.billing.enabled=true

# =====================================================================
# JWT (Bounded Context: Identity)
# =====================================================================
jwt.secret=vazzarSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLongForHmacSha256Security2026
jwt.expiration-ms=86400000
