services:
  postgres:
    image: postgres:18-alpine
    container_name: vazzar-postgres
    environment:
      POSTGRES_DB: vaazar
      POSTGRES_USER: vaazar
      POSTGRES_PASSWORD: vaazar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaazar -d vaazar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: vazzar-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vaazar
      SPRING_DATASOURCE_USERNAME: vaazar
      SPRING_DATASOURCE_PASSWORD: vaazar
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
